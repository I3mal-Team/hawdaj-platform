<div>
  <div class="slider-container" #list>
    <div class="slider" [style.padding-right.px]="currentLanguage !== 'ar' ? 30 : 0"
      [style.padding-left.px]="currentLanguage === 'ar' ? 30 : 0" #slider>
      <ng-container *ngFor="let place of places; let i = index">
        <div class="place" #placeItems (click)="showDetails(place)">
          <img [src]="place?.image" onerror="this.src='assets/images/not-found/no-img.svg'" alt="img">
          <div class="place-content d-flex justify-content-between align-items-center">
            <div>
              <h4 class="text-wrap">{{ place?.title || '' }}</h4>
              <p class="d-flex gap-2 align-items-center">
                <svg xmlns=" http://www.w3.org/2000/svg" width="14" height="20" viewBox="0 0 14 20" fill="none">
                  <path
                    d="M7 9.5C6.33696 9.5 5.70107 9.23661 5.23223 8.76777C4.76339 8.29893 4.5 7.66304 4.5 7C4.5 6.33696 4.76339 5.70107 5.23223 5.23223C5.70107 4.76339 6.33696 4.5 7 4.5C7.66304 4.5 8.29893 4.76339 8.76777 5.23223C9.23661 5.70107 9.5 6.33696 9.5 7C9.5 7.3283 9.43534 7.65339 9.3097 7.95671C9.18406 8.26002 8.99991 8.53562 8.76777 8.76777C8.53562 8.99991 8.26002 9.18406 7.95671 9.3097C7.65339 9.43534 7.3283 9.5 7 9.5ZM7 0C5.14348 0 3.36301 0.737498 2.05025 2.05025C0.737498 3.36301 0 5.14348 0 7C0 12.25 7 20 7 20C7 20 14 12.25 14 7C14 5.14348 13.2625 3.36301 11.9497 2.05025C10.637 0.737498 8.85652 0 7 0Z"
                    fill="white"></path>
                </svg>
                {{ place?.address_name || 'titles.saudiArabia' | translate }}
              </p>
            </div>
            <button>
              <svg class="scaleX-rtl" width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M5.86514 14.1597L21.6353 14.0786" stroke="white" stroke-width="1.98593" stroke-linecap="round"
                  stroke-linejoin="round" />
                <path d="M13.7913 22.0059L21.6358 14.0803L13.7102 6.23578" stroke="white" stroke-width="1.98593"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>

</div>
<div class="d-flex container m-0 align-items-center justify-content-between">
  <div class="d-flex gap-2">
    <button #previousBtn (click)="currentLanguage === 'ar' ? scrollRight() : scrollLeft()">
      <svg xmlns="http://www.w3.org/2000/svg" class="scaleX-rtl" width="24" height="25" viewBox="0 0 24 25" fill="none">
        <path d="M14 16.5417L10 12.5417L14 8.54175" stroke="#3A4980" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round"></path>
      </svg>
    </button>
    <button #nextBtn (click)="currentLanguage === 'ar' ? scrollLeft() : scrollRight()">
      <svg xmlns="http://www.w3.org/2000/svg" class="scaleX-rtl" width="24" height="25" viewBox="0 0 24 25" fill="none">
        <path d="M10 16.5417L14 12.5417L10 8.54175" stroke="#3A4980" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round"></path>
      </svg>
    </button>
  </div>
  <ng-container>
    <h5 (click)="goToPlacesList()"> {{'general.seeAll'|translate}}</h5>
  </ng-container>
</div>
