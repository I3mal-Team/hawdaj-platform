<div class="contact-info-links">
    <!-- Header -->
    <div class="contact-info-links__header">
        <div class="contact-info-links__header-left">
            <img src="assets/images-v2/icons/like.png" alt="contact-info-links-icon">
            <span class="contact-info-links__title">{{ 'profile.socialInfo' | translate }}</span>
        </div>
        <button type="button" class="contact-info-links__add-btn" (click)="addContactInfo()">
            <app-svg-icon name="add"></app-svg-icon>
            <span>{{ 'general.add' | translate }}</span>
        </button>
    </div>

    <!-- Content -->
    <div class="contact-info-links__content">
        <ng-container *ngIf="linksContact?.length > 0">
            <div class="contact-info-links__list" [class.contact-info-links__list--two-items]="validLinksCount === 2">
                <ng-container *ngFor="let item of validLinks; let i = index">
                    <div class="contact-info-links__item">
                        <div class="contact-info-links__item-content">
                            <div class="contact-info-links__item-icon">
                                <span *ngIf="item?.name?.id === 'linkedin'"
                                    class='text-white rounded contact-info-links__icon'>
                                    <img src="assets/images-v2/social/linkedin.svg" alt="LinkedIn" />
                                </span>
                                <i *ngIf="item?.name?.id === 'personal_account'"
                                    class='pi pi-user text-white rounded personal-website contact-info-links__icon'></i>
                                <span *ngIf="item?.name?.id === 'twitter' || item?.name?.id === 'X'"
                                    class='text-white rounded bg-twitter contact-info-links__icon'>
                                    <svg xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision"
                                        text-rendering="geometricPrecision" image-rendering="optimizeQuality"
                                        fill-rule="evenodd" clip-rule="evenodd" viewBox="0 0 512 509.64">
                                        <rect width="512" height="509.64" rx="115.61" ry="115.61" />
                                        <path fill="#fff" fill-rule="nonzero"
                                            d="M323.74 148.35h36.12l-78.91 90.2 92.83 122.73h-72.69l-56.93-74.43-65.15 74.43h-36.14l84.4-96.47-89.05-116.46h74.53l51.46 68.04 59.53-68.04zm-12.68 191.31h20.02l-129.2-170.82H180.4l130.66 170.82z" />
                                    </svg> </span>
                                <span *ngIf="item?.name?.id === 'youtube'"
                                    class='text-white rounded bg-youtube contact-info-links__icon'>
                                    <img src="assets/images-v2/social/youtube.svg" alt="YouTube" />
                                </span>
                                <span *ngIf="item?.name?.id === 'facebook'"
                                    class='text-white rounded bg-color-face contact-info-links__icon'>
                                    <img src="assets/images-v2/social/Facebook.svg" alt="Facebook" />
                                </span>
                                <span *ngIf="item?.name?.id === 'instagram'"
                                    class='text-white rounded bg-color-instagram contact-info-links__icon'>
                                    <img src="assets/images-v2/social/Instagram.svg" alt="Instagram" />
                                </span>
                                <span *ngIf="item?.name?.id === 'tiktok'"
                                    class='text-white rounded bg-color-tiktok contact-info-links__icon'>
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="icon icon-tabler icon-tabler-brand-tiktok-filled" width="17" height="17"
                                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                        <path
                                            d="M16.083 2h-4.083a1 1 0 0 0 -1 1v11.5a1.5 1.5 0 1 1 -2.519 -1.1l.12 -.1a1 1 0 0 0 .399 -.8v-4.326a1 1 0 0 0 -1.23 -.974a7.5 7.5 0 0 0 1.73 14.8l.243 -.005a7.5 7.5 0 0 0 7.257 -7.495v-2.7l.311 .153c1.122 .53 2.333 .868 3.59 .993a1 1 0 0 0 1.099 -.996v-4.033a1 1 0 0 0 -.834 -.986a5.005 5.005 0 0 1 -4.097 -4.096a1 1 0 0 0 -.986 -.835z"
                                            stroke-width="0" fill="currentColor" />
                                    </svg>
                                </span>
                                <span *ngIf="item?.name?.id === 'whatsapp'"
                                    class='text-white rounded bg-whatsapp contact-info-links__icon'>
                                    <img src="assets/images-v2/social/whatsapp.svg" alt="WhatsApp" />
                                </span>
                            </div>
                            <div class="contact-info-links__item-content-wrapper">
                                <div class="contact-info-links__item-name">{{ item?.name?.title | translate }}</div>
                                <a class="contact-info-links__item-link" [href]="item?.link" target="_blank">
                                    {{item?.link}}
                                </a>
                            </div>
                            <div class="contact-info-links__item-actions">
                                <button type="button"
                                    class="contact-info-links__action-btn contact-info-links__action-btn--delete"
                                    (click)="removeItemContact(item)" [attr.aria-label]="'general.delete' | translate">
                                    <app-svg-icon name="delete-file"></app-svg-icon>
                                </button>
                                <button type="button"
                                    class="contact-info-links__action-btn contact-info-links__action-btn--edit"
                                    (click)="addContactInfo(item)" [attr.aria-label]="'general.edit' | translate">
                                    <app-svg-icon name="edit"></app-svg-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div *ngIf="validLinksCount === 2 && i === 0" class="contact-info-links__stick">
                        <app-svg-icon name="stick"></app-svg-icon>
                    </div>
                </ng-container>
            </div>
        </ng-container>

        <ng-container *ngIf="linksContact?.length <= 0">
            <p class="contact-info-links__empty">{{ 'profile.noContactInfoAdded' | translate }}</p>
        </ng-container>
    </div>
</div>
