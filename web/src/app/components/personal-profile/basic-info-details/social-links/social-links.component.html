<div class="col-12 overflow-auto-small add-social-links bg-light p-3 rounded my-md-3 my-2">
  <!-- <hr class="mt-0"> -->
  <h4 class="fs-4-1 line-before">{{'profile.socialInfo' | translate }}</h4>
  <div class="mx-2 mt-md-3 mt-2">
    <ng-container *ngIf="linksSocial?.length<=0">
      <a class='pointer' (click)="addSocialLink()" style="display: inline-block;">
        <h4 class="text-main-color fs-5">
          <i class="fas fa-plus-circle"></i>
          <span>
            {{'profile.addSocialLink' | translate }}
          </span>
        </h4>
      </a>
    </ng-container>
    <div class="row justify-content-between g-2">
      <ng-container *ngFor="let item of linksSocial">
        <ng-container *ngIf="item?.link">
          <div class="col-xl-5 col-lg-6 col-xs-12 px-0">
            <div class="mb-1 mx-2">
              <div
                class="d-flex align-items-center justify-content-between social bg-white flex-wrap gap-2 shadow-sm p-2 rounded">
                <div class="d-flex align-items-baseline">
                  <i *ngIf="item?.name?.id === 'linkedin'"
                    class='pi pi-linkedin text-white rounded bg-linkedin fs-12 icon-social-settings'></i>
                  <i *ngIf="item?.name?.id === 'personal_account'"
                    class='pi pi-user text-white rounded personal-website fs-12 icon-social-settings'></i>
                  <span *ngIf="item?.name?.id === 'twitter'"
                    class='text-white rounded bg-twitter fs-12 icon-social-settings'>
                    <svg [classList]="'hover-icon'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                      fill="currentColor" class="bi bi-twitter-x" viewBox="0 0 16 16">
                      <path
                        d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865l8.875 11.633Z" />
                    </svg>
                  </span>
                  <i *ngIf="item?.name?.id === 'youtube'"
                    class='pi pi-youtube text-white rounded bg-youtube fs-12 icon-social-settings'></i>
                  <i *ngIf="item?.name?.id === 'facebook'"
                    class='pi pi-facebook text-white rounded bg-color-face fs-12 icon-social-settings'></i>
                  <i *ngIf="item?.name?.id === 'instagram'"
                    class='pi pi-instagram text-white rounded bg-color-instagram fs-12 icon-social-settings'></i>
                  <span *ngIf="item?.name?.id === 'tiktok'"
                    class='text-white rounded bg-color-tiktok fs-12 icon-social-settings'>
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-brand-tiktok-filled"
                      width="17" height="17" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
                      stroke-linecap="round" stroke-linejoin="round">
                      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                      <path
                        d="M16.083 2h-4.083a1 1 0 0 0 -1 1v11.5a1.5 1.5 0 1 1 -2.519 -1.1l.12 -.1a1 1 0 0 0 .399 -.8v-4.326a1 1 0 0 0 -1.23 -.974a7.5 7.5 0 0 0 1.73 14.8l.243 -.005a7.5 7.5 0 0 0 7.257 -7.495v-2.7l.311 .153c1.122 .53 2.333 .868 3.59 .993a1 1 0 0 0 1.099 -.996v-4.033a1 1 0 0 0 -.834 -.986a5.005 5.005 0 0 1 -4.097 -4.096a1 1 0 0 0 -.986 -.835z"
                        stroke-width="0" fill="currentColor" />
                    </svg>
                  </span>
                  <span class="mx-2">
                    <a class="social-link text-decoration-underline fw-500 text-black text-wrap-ellipsis"
                      [href]="item?.link" target="_blank">
                      {{item?.link}}
                    </a>
                  </span>
                </div>
                <div class="d-flex align-items-center justify-content-end gap-2">
                  <a class="shadow-none px-0 bg-transparent border-0" role="button" (click)="addSocialLink(item)">
                    <i class="pi pi-pencil edit-icon rounded"></i>
                  </a>
                  <a class="shadow-none px-0 bg-transparent border-0" role="button" (click)="removeItemSocial(item)">
                    <i class="pi pi-trash delete-icon text-danger rounded"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
      </ng-container>
    </div>
    <ng-container *ngIf="linksSocial?.length>0">
      <button type="button" class="btn btn-solid-main py-1 fs-6 my-2" (click)="addSocialLink()">
        <i class="fas fa-plus"></i>
        <span class="mx-1">
          {{'profile.add_other_link' | translate }}
        </span>
      </button>
    </ng-container>
  </div>
</div>
