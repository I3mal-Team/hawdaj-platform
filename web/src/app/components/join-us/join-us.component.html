<section aria-labelledby="join-us-heading">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="join-us-container">
        <!-- Use an image with descriptive alt text for SEO -->
        <img class="join-us-img" src="../../../../assets/images/auth/join-us.svg" alt="Join our community">
        <h2 id="join-us-heading" class="text-center">Join Us</h2>
        <!-- Use a button with an ARIA role for accessibility -->
        <button class="btn btn-solid-main form-btn" role="button" (click)="login()">Login</button>
      </div>
    </div>
  </div>
</section>
