<div id="events-home">
    <div class="event-second-bg">
        <div appLazyLoadSection class="container">
            <ng-container *ngIf="items?.length > 0">
                <div class="items-list mt-md-4 mt-3 d-none d-lg-block">
                    <div class="row g-3">
                        <div class="cards d-flex flex-row align-items-center justify-content-center"
                            [class.w-100]="isSearch">
                            <div (mouseenter)="displayContent(i)" class="card" (click)="goToDetails(item?.slug)"
                                *ngFor="let item of isSearch ? items : _PublicService.slicedData(items,5); let i = index"
                                [class.active]="i === activeIndex || isSearch">
                                <img ngOptimizedImage src="{{item?.image}}" alt="Image" width="300" height="400" />
                                <div class="card-content">
                                    <h4> {{item?.title}}</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <p-carousel [value]="items" [numVisible]="1" [numScroll]="1" class="d-lg-none" [showNavigators]="false"
                    [autoplayInterval]="4000" [circular]="true" [showIndicators]="true"
                    [responsiveOptions]="responsiveOptions">
                    <ng-template pTemplate="item" let-item>
                        <div class="d-flex response justify-content-center">
                            <div class="card custom-card small-card mt-lg-3" [routerLink]="['/stories/' + item?.slug]">
                                <img class="w-100 h-100" ngOptimizedImage [src]="item?.image" width="350" height="250"
                                    [alt]="item?.title">
                                <div
                                    class="card-img-overlay align-items-center text-white d-flex flex-column justify-content-center p-3">
                                    <div class="card-content-sm" *ngIf="item?.title!=null||item?.description!=null">
                                        <h5 class="title">{{item?.title}}</h5>
                                        <p class="desctiption">{{item?.description | stripHtml}}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ng-template>
                </p-carousel>
            </ng-container>
        </div>
    </div>
</div>
