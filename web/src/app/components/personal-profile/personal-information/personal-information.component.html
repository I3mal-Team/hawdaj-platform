<div id="personal-info" [class.ar-personal-info]="currentLanguage=='ar'">
  <!-- Start Profile Slider Stories -->
  <div class="mt-4 profile-stories overflow-hidden">
    <ng-container *ngIf="isLoadingStories; else noLoadingStories">
      <app-skeleton [type]="'myLastDayStories'"></app-skeleton>
    </ng-container>
    <ng-template #noLoadingStories>
      <app-stories-slider [items]="stories" (addNewStoryHandler)="addNewStory($event)"></app-stories-slider>
    </ng-template>
  </div>
  <!-- End Profile Slider Stories -->

  <!-- Tabs -->
  <ng-container *ngIf="currentProfileData?.myStories?.items?.length>0; else elseNoPostsYet">
    <div class="mt-5">
      <p-tabView styleClass="tabview-custom">
        <p-tabPanel>
          <ng-template pTemplate="header">
            <div class="d-flex align-items-center gap-2">
              <span>
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-layout-grid" width="20"
                  height="20" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M4 4m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
                  <path d="M14 4m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
                  <path d="M4 14m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
                  <path d="M14 14m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
                </svg>
              </span>
              <span>{{'profile.posts'|translate}}</span>
            </div>
          </ng-template>
          <div class="row g-3">
            <ng-container *ngFor="let item of currentProfileData?.myStories?.items">
              <div class="col-lg-4 col-sm-6 col-4">
                <div class="tab-img shadow-sm rounded p-2 overflow-hidden">
                  <img [src]="item.file" alt="story" class="rounded w-100 h-100"
                    onerror="src='assets/images/not-found/no-img.svg'">
                </div>
              </div>
            </ng-container>
          </div>
        </p-tabPanel>
        <p-tabPanel header="Header II">
          <ng-template pTemplate="header">
            <div class="d-flex align-items-center gap-2">
              <span>
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-user-square" width="20"
                  height="20" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M9 10a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
                  <path d="M6 21v-1a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v1" />
                  <path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14z" />
                </svg>
              </span>
              <span>{{'profile.tagged'|translate}}</span>
            </div>
          </ng-template>
          <div class="row g-3">
            <ng-container *ngFor="let item of currentProfileData?.myStories?.items">
              <div class="col-lg-4 col-sm-6 col-4">
                <div class="tab-img shadow-sm rounded p-2 overflow-hidden">
                  <img [src]="item.file" alt="story" class="rounded w-100 h-100"
                    onerror="src='assets/images/not-found/no-img.svg'">
                </div>
              </div>
            </ng-container>
          </div>
        </p-tabPanel>
      </p-tabView>
    </div>
  </ng-container>
  <ng-template #elseNoPostsYet>

  </ng-template>
</div>
