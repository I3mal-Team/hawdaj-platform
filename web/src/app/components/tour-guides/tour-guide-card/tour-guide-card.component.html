<div class="tour-card card text-center mb-md-3 mb-5" [attr.aria-label]="'Tour guide card for {{item?.name}}'"
  [routerLink]="['/tour-guides', item?.id]">
  <div class="card-img-top rounded-top">
    <img [src]="item?.image" width="200" class="w-100 application-img" alt="Portrait of {{item?.name}}"
      (error)="handleImageError($event, item?.gender)">
  </div>
  <div class="card-body text-white p-3 d-flex flex-column gap-1">
    <div class="d-flex justify-content-between align-items-center gap-2">
      <h5 class="card-title mb-0 text-truncate" [title]="item?.name">
        {{item?.name || 'Eslam Afify'}}
      </h5>
      <span class="rating d-flex gap-1 align-items-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="17" viewBox="0 0 16 17" fill="none">
          <path
            d="M7.65311 2.90784C7.6813 2.83906 7.72932 2.78023 7.79105 2.73882C7.85279 2.6974 7.92544 2.67529 7.99978 2.67529C8.07411 2.67529 8.14676 2.6974 8.2085 2.73882C8.27023 2.78023 8.31825 2.83906 8.34644 2.90784L9.76311 6.31518C9.78963 6.37893 9.83322 6.43414 9.88909 6.47472C9.94496 6.5153 10.0109 6.53968 10.0798 6.54518L13.7584 6.83984C14.0911 6.86651 14.2258 7.28184 13.9724 7.49851L11.1698 9.89984C11.1174 9.94464 11.0784 10.003 11.057 10.0685C11.0356 10.134 11.0326 10.2041 11.0484 10.2712L11.9051 13.8612C11.9223 13.9332 11.9178 14.0087 11.8921 14.0782C11.8665 14.1476 11.8208 14.2079 11.7609 14.2514C11.7009 14.295 11.6295 14.3197 11.5555 14.3227C11.4815 14.3256 11.4083 14.3065 11.3451 14.2678L8.19511 12.3445C8.13627 12.3086 8.06869 12.2897 7.99978 12.2897C7.93086 12.2897 7.86328 12.3086 7.80444 12.3445L4.65444 14.2685C4.59128 14.3072 4.51808 14.3262 4.44408 14.3233C4.37008 14.3204 4.29861 14.2956 4.23869 14.2521C4.17877 14.2086 4.13308 14.1483 4.10741 14.0788C4.08174 14.0094 4.07722 13.9339 4.09444 13.8618L4.95111 10.2712C4.967 10.2041 4.96408 10.134 4.94267 10.0684C4.92126 10.0029 4.8822 9.94459 4.82978 9.89984L2.02711 7.49851C1.97098 7.45025 1.93038 7.38647 1.91041 7.3152C1.89043 7.24393 1.89198 7.16834 1.91485 7.09794C1.93772 7.02754 1.9809 6.96548 2.03895 6.91956C2.097 6.87363 2.16734 6.8459 2.24111 6.83984L5.91978 6.54518C5.98861 6.53968 6.05459 6.5153 6.11046 6.47472C6.16633 6.43414 6.20992 6.37893 6.23644 6.31518L7.65311 2.90784Z"
            stroke="#3A4980" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>{{item?.rate||0}}</span>
      </span>
    </div>
    <ng-container *ngIf="truncateText; else elseTruncate">
      <p class="description text-center text-md-start" appTextTruncate [color]="'white'" [maxLines]="2"
        readMoreText="{{'readMore' | translate}}" readLessText="{{'showLess' | translate}}">
        {{item.description | stripHtml}}
      </p>
    </ng-container>
    <ng-template #elseTruncate>
      <p class="card-text mb-0 text-truncate" [title]="item?.description | stripHtml">
        {{(item?.description ||'') | stripHtml}}
      </p>
    </ng-template>
    <p class="card-text mb-0 text-truncate" [title]="item?.type">
      {{item?.type || ''}}
    </p>

    <!-- <ng-container *ngIf="item?.type=='app'">
    <div class="d-flex justify-content-center align-content-center btn-action-card">
      <button id="btn-action" name="details" class="btn w-content glass-button text-white" [routerLink]="'/tour-guide/'+item?.id">
        {{'general.moreDetails'|translate}} 
      </button>
      </div>
    </ng-container> -->
  </div>
</div>
