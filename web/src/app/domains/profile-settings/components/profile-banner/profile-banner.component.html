<header class="profile-banner" role="banner" aria-label="profile banner">
  <div class="profile-banner__cover" [attr.aria-hidden]="!isBrowser">
    <img [src]="profile.cover.src" [alt]="profile.cover.alt" width="1600" height="320" priority fetchPriority="high" />
  </div>

  <div class="profile-banner__inner">
    <div class="profile-banner__avatar" role="img" [attr.aria-label]="profile.avatar.alt || profile.name" tabindex="0">
      <img class="profile-banner__avatar-img" [src]="profile.avatar.src" [alt]="profile.avatar.alt || profile.name"
        width="120" height="120" priority />
    </div>

    <div class="profile-banner__meta">
      <h1 class="profile-banner__name" dir="auto">{{ profile.name }}</h1>
      <p class="profile-banner__email">
        <a class="profile-banner__email-link" href="mailto:{{ profile.email }}" *ngIf="profile.email; else noEmail">{{
          profile.email }}</a>
        <ng-template #noEmail><span class="profile-banner__email-empty">—</span></ng-template>
      </p>

      <ul class="profile-banner__stats" role="list" aria-label="profile statistics">
        <li class="profile-banner__stat" role="listitem">
          <span class="profile-banner__stat-value">{{ profile.counts.followers }}</span>
          <span class="profile-banner__stat-key">المتابعون</span>
        </li>
        <li class="profile-banner__stat" role="listitem">
          <span class="profile-banner__stat-value">{{ profile.counts.following }}</span>
          <span class="profile-banner__stat-key">المتابَعون</span>
        </li>
        <li class="profile-banner__stat" role="listitem">
          <span class="profile-banner__stat-value">{{ profile.counts.points }}</span>
          <span class="profile-banner__stat-key">نقطة</span>
        </li>
      </ul>
    </div>

    <div class="profile-banner__actions" *ngIf="profile.editable" role="group" aria-label="profile actions">
      <button class="btn btn--primary profile-banner__edit" type="button">
        تعديل
      </button>
    </div>
  </div>
</header>
