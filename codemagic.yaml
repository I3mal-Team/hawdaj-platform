########################################################################
# Codemagic CI/CD — hawdaj-platform monorepo
#
# 2 independent workflows (web only). Each triggers only when a push
# touches web/ (`when.changeset.includes`).
#
# Backend and mobile are intentionally NOT wired up here yet.
#
# NOTE (Codemagic behavior): the very first push after this file is added
# will trigger ALL workflows once, regardless of changed paths. Path
# filtering only kicks in starting from the next push after that.
#
# Required setup in the Codemagic dashboard (Team settings > Environment
# variable groups) BEFORE these workflows can run successfully:
#   - web_staging          (HOST, USERNAME, SSH_PRIVATE_KEY)
#   - web_production       (HOST, USERNAME, SSH_PRIVATE_KEY)
########################################################################

workflows:

  # ------------------------------------------------------------------
  # WEB (Angular SSR) — staging
  # ------------------------------------------------------------------
  web-staging:
    name: Web · Staging
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: web
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: staging
          include: true
    when:
      changeset:
        includes:
          - web/
    environment:
      node: 20
      groups:
        - web_staging
      vars:
        DEPLOY_BRANCH: staging
        PROJECT_PATH: /var/www/hawdaj_project/hawdaj-frontend-staging
        BUILD_CMD: build:ssr-staging
        PM2_APP_NAME: hawdaj-staging
        PM2_PORT: "4002"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build check (fails fast before touching the server)
        script: npm run $BUILD_CMD
      - name: Deploy via SSH
        script: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$USERNAME@$HOST" \
            "PROJECT_PATH='$PROJECT_PATH' BRANCH='$DEPLOY_BRANCH' BUILD_CMD='$BUILD_CMD' APP_NAME='$PM2_APP_NAME' PORT='$PM2_PORT' bash -s" <<'REMOTE_SCRIPT'
          set -e
          cd "$PROJECT_PATH"
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          git config --global --add safe.directory "$PROJECT_PATH"
          git stash || true
          git pull origin "$BRANCH"
          git stash pop || true
          npm install
          npm run "$BUILD_CMD"
          if pm2 list | grep -q "$APP_NAME"; then
            pm2 reload "$APP_NAME"
          else
            PORT="$PORT" pm2 start dist/hawdaj/server/main.js --name "$APP_NAME"
          fi
          pm2 save
          sudo systemctl reload nginx
          REMOTE_SCRIPT

  # ------------------------------------------------------------------
  # WEB (Angular SSR) — production
  # ------------------------------------------------------------------
  web-production:
    name: Web · Production
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: web
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    when:
      changeset:
        includes:
          - web/
    environment:
      node: 20
      groups:
        - web_production
      vars:
        DEPLOY_BRANCH: main
        PROJECT_PATH: /var/www/hawdaj_project/hawdaj-frontend-production
        BUILD_CMD: build:ssr-prod
        PM2_APP_NAME: hawdaj-production
        PM2_PORT: "4001"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build check (fails fast before touching the server)
        script: npm run $BUILD_CMD
      - name: Deploy via SSH
        script: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$USERNAME@$HOST" \
            "PROJECT_PATH='$PROJECT_PATH' BRANCH='$DEPLOY_BRANCH' BUILD_CMD='$BUILD_CMD' APP_NAME='$PM2_APP_NAME' PORT='$PM2_PORT' bash -s" <<'REMOTE_SCRIPT'
          set -e
          cd "$PROJECT_PATH"
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          git config --global --add safe.directory "$PROJECT_PATH"
          git stash || true
          git pull origin "$BRANCH"
          git stash pop || true
          npm install
          npm run "$BUILD_CMD"
          if pm2 list | grep -q "$APP_NAME"; then
            pm2 reload "$APP_NAME"
          else
            PORT="$PORT" pm2 start dist/hawdaj/server/main.js --name "$APP_NAME"
          fi
          pm2 save
          sudo systemctl reload nginx
          REMOTE_SCRIPT
