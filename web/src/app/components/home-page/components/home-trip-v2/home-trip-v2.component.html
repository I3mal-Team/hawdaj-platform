<section id="ourTripsSection">
    <div class="container">
        <div class="row justify-content-center">
            <div>
                <div
                    class="d-flex gap-2 flex-column mt-4 mx-0 align-items-center px-md-5 px-2 home-trips justify-content-center position-relative">
                    <div class="trip-overlay position-absolute text-center"></div>
                    <div class="content">
                        <h2>
                            {{'homePage.ourTrips'|translate}}
                        </h2>
                        <p class="text-center">
                            {{'homePage.travel'|translate}}
                        </p>
                        <a class="start-trip mt-2 text-capitalize d-flex align-items-center justify-content-center gap-2"
                            (click)="startTrip()">
                            <img NgOptimizedImage src="assets/images/icons/startup 1.svg" alt="img">
                            {{'trip.startYourTrip'|translate}}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
