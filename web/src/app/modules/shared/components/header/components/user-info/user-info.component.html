<div class="user-info position-relative general-dropdown d-xl-block d-none"
  (clickOutside)="collapse == true ? (collapse = false) : ''">
  <div class="dropdown">
    <button class="btn dropdown-toggle text-white-color p-0 d-flex gap-1 align-items-center text-truncate fw-500"
      type="button" aria-expanded="false" [attr.aria-expanded]="!collapse" (click)="collapse = !collapse">
      <div class="d-flex align-items-center gap-2">
        <ng-container *ngIf="currentLoginInformation?.PersonalData?.photo; else noImg">
          <a class="rounded-circle profile-img d-block shadow-sm position-relative">
            <img [src]="currentLoginInformation?.PersonalData?.photo" [alt]="'name'"
              onerror="src='assets/images/not-found/no-img.svg'" loading="lazy" class="w-100 h-100 rounded-circle">
          </a>
        </ng-container>
        <ng-template #noImg>
          <a
            class="rounded-circle profile-img d-flex justify-content-center align-items-center fs-8 text-white-color fw-bold text-uppercase shadow position-relative">
            {{summaryName}}
          </a>
        </ng-template>
        <div class="name text-truncate fw-semibold">
          {{currentLoginInformation?.PersonalData?.full_name||''}}</div>
      </div>
    </button>
    <ul class="dropdown-menu border-0 shadow p-3 mt-3" [class.show]="collapse">
      <li class="nav-item mb-2">
        <a class="nav-link  w-100" (click)="collapse = !collapse" [routerLink]="'/Profile'">
          <span class="d-flex align-items-center w-100 gap-1 p-2">
            <svg viewBox="0 0 24 24" fill="none" width="20px" xmlns="http://www.w3.org/2000/svg">
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
              <g id="SVGRepo_iconCarrier">
                <path
                  d="M5 21C5 17.134 8.13401 14 12 14C15.866 14 19 17.134 19 21M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z"
                  stroke="#3A4980" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </g>
            </svg> <span class="user">{{'nav.profile'|translate}}</span>
          </span>
        </a>
      </li>
      <li class="nav-item mb-3">
        <a class="nav-link  w-100" (click)="collapse = !collapse" [routerLink]="'/trips/list'">
          <span class="d-flex align-items-center w-100 gap-1 p-2">
            <svg fill="#3A4980" width="20px" height="20px" viewBox="0 0 25.6 25.6" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M23.358 1.648c0.261 0 0.444 0.048 0.54 0.085 0.115 0.306 0.269 1.401 -0.863 2.534L17.26 10.041l0.042 0.716c0.088 1.499 0.25 4.186 0.39 6.489 0.124 2.05 0.241 3.986 0.248 4.151 0.004 0.113 0.006 0.14 -0.1 0.267 -0.236 0.287 -0.676 0.773 -1.048 1.176 -0.576 -1.551 -1.785 -4.826 -2.453 -6.66l-0.858 -2.359 -1.776 1.776 -3.265 3.14 -0.455 0.454 -0.014 0.642c-0.011 0.512 -0.008 1.432 -0.007 2.243 0.002 0.565 0.003 1.078 -0.001 1.361 -0.007 0.013 0.109 0.029 0.098 0.048 -0.07 -0.112 -0.144 -0.232 -0.224 -0.357 -0.658 -1.05 -1.57 -2.502 -1.848 -2.956l-0.203 -0.332 -0.334 -0.202c-1.213 -0.733 -2.557 -1.579 -3.377 -2.107 0.028 -0.016 0.052 0.07 0.07 0.06h0.053c0.258 0 0.684 0.006 1.162 0.012 0.625 0.008 1.334 0.019 1.877 0.019 0.208 0 0.393 -0.002 0.542 -0.005l0.642 -0.015 0.454 -0.454 3.144 -3.243 1.77 -1.769 -2.348 -0.864c-1.765 -0.649 -5.145 -1.912 -6.726 -2.506 0.406 -0.374 0.894 -0.817 1.18 -1.053 0.08 -0.066 0.142 -0.099 0.184 -0.099l0.056 0.002c0.176 0.008 2.367 0.152 4.485 0.29 2.248 0.147 4.786 0.312 6.229 0.404l0.721 0.045 5.776 -5.776c0.811 -0.81 1.608 -0.931 2.011 -0.931m0 -1.6c-0.945 0 -2.106 0.363 -3.142 1.4L14.951 6.712c-2.966 -0.188 -10.561 -0.69 -10.749 -0.695a2.525 2.525 0 0 0 -0.122 -0.003c-0.256 0 -0.699 0.049 -1.203 0.466 -0.592 0.489 -1.825 1.649 -1.825 1.649 -0.298 0.298 -0.448 0.668 -0.412 1.016 0.022 0.21 0.136 0.593 0.652 0.794 0.313 0.123 5.298 1.988 7.599 2.834L5.746 16.016c-0.139 0.003 -0.312 0.005 -0.506 0.005 -0.958 0 -2.444 -0.031 -3.04 -0.031 -0.079 0 -0.142 0 -0.187 0.002 -0.181 0.006 -0.556 -0.084 -1.546 0.744l-0.07 0.066C0.1 17.097 0.03 17.393 0.024 17.589c-0.006 0.202 0.048 0.492 0.339 0.726 0.175 0.142 2.421 1.58 4.263 2.692 0.442 0.72 2.474 3.95 2.58 4.125 0.155 0.262 0.408 0.411 0.711 0.42h0.025c0.294 0 0.597 -0.146 0.893 -0.434 0.838 -0.98 0.722 -1.385 0.726 -1.556 0.013 -0.534 -0.009 -2.798 0.01 -3.696l3.265 -3.14c0.834 2.292 2.658 7.225 2.78 7.539 0.203 0.516 0.586 0.629 0.796 0.65 0.034 0.004 0.07 0.006 0.104 0.006 0.316 0 0.643 -0.148 0.911 -0.416 0 0 1.156 -1.227 1.648 -1.824 0.492 -0.597 0.473 -1.106 0.463 -1.347 -0.004 -0.166 -0.467 -7.72 -0.639 -10.67L24.164 5.397c1.866 -1.867 1.57 -4.117 0.876 -4.809 -0.306 -0.308 -0.926 -0.54 -1.682 -0.54z" />
            </svg><span class="trip">{{'nav.myTrips'|translate}}</span>
          </span>
        </a>
      </li>
      <hr class="my-2" />
      <li class="nav-item">
        <a class="nav-link w-100 logout p-2" (click)="logOut();collapse = !collapse">
          <span class="d-flex gap-1 align-items-center w-100">
            <svg viewBox="0 0 24 24" width="20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
              <g id="SVGRepo_iconCarrier">
                <path
                  d="M8.90002 7.55999C9.21002 3.95999 11.06 2.48999 15.11 2.48999H15.24C19.71 2.48999 21.5 4.27999 21.5 8.74999V15.27C21.5 19.74 19.71 21.53 15.24 21.53H15.11C11.09 21.53 9.24002 20.08 8.91002 16.54"
                  stroke="red" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M15 12H3.62" stroke="red" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                </path>
                <path d="M5.85 8.6499L2.5 11.9999L5.85 15.3499" stroke="red" stroke-width="1.5" stroke-linecap="round"
                  stroke-linejoin="round"></path>
              </g>
            </svg>
            <span class="logout">{{'general.logout'|translate}}</span>
          </span>
        </a>
      </li>
    </ul>
  </div>
</div>
<div class="d-xl-none d-flex align-items-center gap-2 flex-column w-100">
  <div class="user-img">
    <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-user-circle" width="44" height="44"
      viewBox="0 0 24 24" stroke-width="1.5" stroke="#ffffff" fill="none" stroke-linecap="round"
      stroke-linejoin="round">
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
      <path d="M12 10m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
      <path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855" />
    </svg>
  </div>
  <div>
    <h5 class="name fs-5-1 text-white-color fw-semibold text-capitalize mb-1 text-center">
      {{currentLoginInformation?.full_name||''}}</h5>
    <p class="mb-0 text-center">{{currentLoginInformation?.email||''}}</p>
  </div>
</div>

<p-confirmDialog [style]="{ width: '450px' }"></p-confirmDialog>
