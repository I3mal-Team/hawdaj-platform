<div id="chat">
    <div class="chat-header p-3 d-flex justify-content-between align-items-center pointer" (click)="openComingSoon()">
        <div class="d-flex align-items-center gap-2">
            <img class="rounded-circle" [src]="profileImage" alt="chat">
            <div>
                <h5 class="title">{{title|translate}}</h5>
            </div>
        </div>
        <button>

                    stroke="#3A4980" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg> </button>
    </div>
    <div>
        <div class="p-4 chat-messages position-relative" #chatGpt>
            <div *ngIf="chat?.length==0" class="overlay-chat position-absolute pointer" (click)="openComingSoon()">
            </div>
            <div class="chat-content pe-3">
                <ng-container *ngIf="isLoadingChat; else noLoadingChat">
                    <app-skeleton [type]="'chat'"></app-skeleton>
                </ng-container>
                <ng-template #noLoadingChat>
                    <ng-container *ngIf="chat?.length>0; else noChat">
                        <div *ngFor="let item of chat">
                            <div class="mb-4" *ngIf="item.type=='one'">
                                <div>
                                    <div class="d-flex align-items-end gap-2 mb-2">
                                        <img class="chat-img rounded-circle" [src]="chatImg" alt="item.type">
                                        <div class="w-fit-content chat-text  position-relative p-3  text-one round">
                                            <p class="fs-8 lh-sm mb-0">
                                                {{item.text}}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4" *ngIf="item.type=='two'">
                                <div class="d-flex align-items-end flex-column">
                                    <div
                                        class="w-fit-content chat-text p-3 text-two round  position-relative d-flex justify-content-end">
                                        <p class="fs-8 text-dark lh-sm mb-0 text-white-color">
                                            {{item?.text}}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                    <ng-template #noChat>
                        <div class="py-4 d-flex no-provider justify-content-center align-items-center gap-3 flex-column"
                            style="height: 450px;">
                            <img [src]="chatImg" alt="no-data" width="160" height="160">
                            <p class="description fw-bold text-dark">
                                {{'places.askAnything'|translate}}
                            </p>
                        </div>
                    </ng-template>
                </ng-template>
            </div>
            <div class="message p-3 pb-0 w-100">
                <form class="mb-2" [formGroup]="chatForm">
                    <div class="p-inputgroup bg-white-color rounded-pill">
                        <input #message class="form-control bg-transparent form-control border-0"
                            formControlName="message" name="message" placeholder="{{'placeholder.type'|translate}}" />
                        <span class="p-inputgroup-addon bg-transparent border-0 py-0 w-fit-content">
                            <div class="d-flex align-items-center gap-3 w-100 justify-content-end">
                                <a class="text-muted-color" (click)="fileInput.click()">
                                    <svg width="19" height="21" viewBox="0 0 19 21" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
