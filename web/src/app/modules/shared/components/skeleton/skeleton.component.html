<!-- Trip Full Page Skeleton -->
<ng-container *ngIf="type === 'trip-full-page'">
  <div id="trip-full-page-skeleton" class="trip-full-page-skeleton container pt-5 px-0">

    <!-- ===================================== -->
    <!-- Top Cards (Desktop)                   -->
    <!-- ===================================== -->
    <div class="row mt-md-5 justify-content-center d-none d-lg-flex">

      <!-- First Card -->
      <div class="col-lg-6 d-flex flex-column gap-4">
        <p-skeleton width="100%" height="10rem" styleClass="default-skeleton" borderRadius="12px"></p-skeleton>

        <div class="row gap-3 justify-content-center">
          <div class="col-md-5">
            <p-skeleton width="100%" height="3rem" styleClass="default-skeleton" borderRadius="8px"></p-skeleton>
          </div>
          <div class="col-md-5">
            <p-skeleton width="100%" height="3rem" styleClass="default-skeleton" borderRadius="8px"></p-skeleton>
          </div>
        </div>
      </div>

      <!-- Second Card -->
      <div class="col-lg-6 d-flex flex-column gap-4">
        <p-skeleton width="100%" height="10rem" styleClass="default-skeleton" borderRadius="12px"></p-skeleton>

        <div class="row gap-3 justify-content-center">
          <div class="col-md-5">
            <p-skeleton width="100%" height="3rem" styleClass="default-skeleton" borderRadius="8px"></p-skeleton>
          </div>
          <div class="col-md-5">
            <p-skeleton width="100%" height="3rem" styleClass="default-skeleton" borderRadius="8px"></p-skeleton>
          </div>
        </div>
      </div>

    </div>

    <!-- ===================================== -->
    <!-- Mobile Cards                          -->
    <!-- ===================================== -->
    <div class="row mt-5 gap-4 justify-content-center d-lg-none">
      <div class="col-12 d-flex flex-column gap-3">
        <p-skeleton width="100%" height="8rem" styleClass="default-skeleton" borderRadius="12px"></p-skeleton>
        <p-skeleton width="100%" height="8rem" styleClass="default-skeleton" borderRadius="12px"></p-skeleton>
      </div>

      <div class="col-12 d-flex flex-column gap-3">
        <p-skeleton width="100%" height="3rem" styleClass="default-skeleton" borderRadius="8px"></p-skeleton>
        <p-skeleton width="100%" height="3rem" styleClass="default-skeleton" borderRadius="8px"></p-skeleton>
      </div>
    </div>

    <!-- ===================================== -->
    <!-- Trip Header                           -->
    <!-- ===================================== -->
    <div class="row mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <p-skeleton width="40%" height="2.5rem" styleClass="default-skeleton"></p-skeleton>

        <div class="d-flex gap-2">
          <p-skeleton width="3rem" height="3rem" shape="circle" styleClass="default-skeleton"></p-skeleton>
          <p-skeleton width="3rem" height="3rem" shape="circle" styleClass="default-skeleton"></p-skeleton>
        </div>
      </div>
    </div>

    <!-- ===================================== -->
    <!-- Timeline Days                         -->
    <!-- ===================================== -->
    <div class="row">
      <ng-container *ngFor="let day of [1,2,3]">
        <div class="col-12 mb-4">

          <!-- Day Header -->
          <div class="d-flex justify-content-between align-items-center mb-3 p-3"
            style="background: #f9fcff; border-radius: 12px;">
            <div class="d-flex gap-3 align-items-center">
              <p-skeleton width="3rem" height="3rem" styleClass="default-skeleton" borderRadius="8px"></p-skeleton>
              <p-skeleton width="8rem" height="1.5rem" styleClass="default-skeleton"></p-skeleton>
            </div>
            <p-skeleton width="10rem" height="1rem" styleClass="default-skeleton"></p-skeleton>
          </div>

          <!-- Places Grid -->
          <div class="row gap-3">
            <ng-container *ngFor="let place of [1,2,3,4]">
              <div class="col-lg-2 col-md-3 col-6">
                <p-skeleton width="100%" height="20rem" styleClass="default-skeleton" borderRadius="16px"></p-skeleton>
              </div>
            </ng-container>
          </div>

        </div>
      </ng-container>
    </div>

  </div>
</ng-container>
