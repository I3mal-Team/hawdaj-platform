########################################################################
# Codemagic CI/CD — hawdaj-platform monorepo
#
# 4 independent workflows: Android and iOS split apart, each with its own
# staging/production pair. All 4 trigger only when a push touches mobile/
# (`when.changeset.includes`) — they can't be split by path any further
# since Android and iOS share the same Flutter/Dart source in mobile/lib.
#
# Backend and web are intentionally NOT wired up here yet.
#
# NOTE (Codemagic behavior): the very first push after this file is added
# will trigger ALL workflows once, regardless of changed paths. Path
# filtering only kicks in starting from the next push after that.
#
# Required setup in the Codemagic dashboard (Team settings > Environment
# variable groups / Code signing identities / Integrations) BEFORE these
# workflows can run successfully:
#   - google_play          (GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS)
#   - Android keystore uploaded under "Code signing identities" with
#     reference name: hawdaj_android_keystore
#   - App Store Connect API key already added under "Integrations",
#     integration name: torido (Fady's account, App Manager access)
########################################################################

workflows:

  # ------------------------------------------------------------------
  # ANDROID — staging  →  Play Internal track
  # ------------------------------------------------------------------
  android-staging:
    name: Android · Staging
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: mobile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: staging
          include: true
    when:
      changeset:
        includes:
          - mobile/
    environment:
      flutter: stable
      groups:
        - google_play
      android_signing:
        - hawdaj_android_keystore
    scripts:
      - name: Write key.properties from Codemagic keystore
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=$CM_KEYSTORE_PATH" >> android/key.properties
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build Android app bundle
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  # ------------------------------------------------------------------
  # ANDROID — production  →  Play Production track (draft)
  # ------------------------------------------------------------------
  android-production:
    name: Android · Production
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: mobile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    when:
      changeset:
        includes:
          - mobile/
    environment:
      flutter: stable
      groups:
        - google_play
      android_signing:
        - hawdaj_android_keystore
    scripts:
      - name: Write key.properties from Codemagic keystore
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=$CM_KEYSTORE_PATH" >> android/key.properties
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build Android app bundle
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: true

  # ------------------------------------------------------------------
  # iOS — staging  →  TestFlight
  # ------------------------------------------------------------------
  ios-staging:
    name: iOS · Staging
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: staging
          include: true
    when:
      changeset:
        includes:
          - mobile/
    integrations:
      app_store_connect: torido
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hawdaj
    scripts:
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build iOS ipa
        script: flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS_PLIST
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ------------------------------------------------------------------
  # iOS — production  →  TestFlight (App Store submission stays manual)
  # ------------------------------------------------------------------
  ios-production:
    name: iOS · Production
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    when:
      changeset:
        includes:
          - mobile/
    integrations:
      app_store_connect: torido
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hawdaj
    scripts:
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build iOS ipa
        script: flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS_PLIST
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
