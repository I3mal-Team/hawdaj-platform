<div id="search-sm" class="d-lg-none d-flex flex-column align-items-center justify-content-center pt-4">
    <div class="container">
        <div class="d-flex align-items-center gap-3 search-sm-bg position-relative pointer"
            (click)="displaySearch=true">
            <div class="search-sm-icon d-flex justify-content-center align-items-center rounded-circle">
                <i class="pi pi-search text-white-color"></i>
            </div>
            <div class="text-white-color">
                <h5 class="fs-5-2 mb-0">{{searchTitle??'places.searchForPlaces'|translate}}</h5>
                <p class="mb-0 fs-6-1 pe-3">{{searchSubtitle??'places.searchBy'|translate}}</p>
            </div>
            <a
                class="search-sm-arrow position-absolute d-flex justify-content-center align-items-center gap-3 rounded-circle">
                <ng-container *ngIf="isFormFilled()">
                    <i class="pi pi-times text-white-color" (click)="clearAll();$event.stopPropagation()"></i>
                </ng-container>
                <i class="pi pi-angle-right text-white-color" (click)="displaySearch=true"></i>
            </a>
        </div>
    </div>
    <p-sidebar [(visible)]="displaySearch" position="bottom" [baseZIndex]="10000">
        <div class="p-1 search-sm-content">
            <a class="close-search mb-3 mt-1" (click)="displaySearch=false"></a>
            <section id="search" appLazyLoadSection (sectionInView)="searchSection = true">
                <form *ngIf="searchSection" [formGroup]="searchForm" class="mx-2" (ngSubmit)="search()">
                    <div style="padding-top: 35px;">
                        <div *ngFor="let field of fieldsConfig" class="search-sm-input mb-3"
                            [class.active]="formValues?.[field.name]?.valid || searchForm?.value[field.name]"
                            [class.visited]="focusedField === field.name">
                            <div class="p-3 row m-0 flex-nowrap w-100">
                                <div class="icon d-flex justify-content-center align-items-center rounded-circle col">
                                    <img [src]="field.smIcon" [alt]="field.name" loading="lazy" appLazyLoadImage />
                                </div>
                                <div class="w-87 col">
                                    <label [for]="field.name" class="fs-8 text-uppercase label-form">
                                        {{ field.label | translate }}
                                    </label>

                                    <span *ngIf="field.type === 'text' ||field.type === 'number'"
                                        class="d-flex align-items-center gap-1 w-100">
                                        <input [type]="field.type"
                                            class="form-control p-0 h-auto bg-transparent border-0"
                                            [formControlName]="field.name"
                                            [placeholder]="field?.placeholder | translate" pInputText #inputRef
                                            (blur)="onChangeControl(field.name); focusedField = null"
                                            (focus)="focusedField = field.name">
                                        <ng-container *ngIf="inputRef?.value">
                                            <i (click)="clearField(field?.name, $event);inputRef.value=''; searchForm.get(field.name)?.reset()"
                                                class="pi pi-times pointer"></i>
                                        </ng-container>
                                    </span>

                                    <span *ngIf="field?.type === 'select'" class="p-input-icon-right d-block"
                                        [class.disabled]="field.dependsOn && !searchForm.value[field.dependsOn]">
                                        <p-dropdown [options]="field?.listValues" [formControlName]="field?.name"
                                            optionLabel="name" [filter]="true" (onFocus)="focusedField = field?.name"
                                            (onHide)="focusedField = null"
                                            placeholder="{{ 'placeholder.search' | translate }}" styleClass="border-0"
                                            (onChange)="field.onChange ? this[field.onChange]($event) : onChangeControl(field.name)"
                                            filterBy="name" appendTo="body" [showClear]="false"
                                            [readonly]="field.isLoading || (field.dependsOn && !searchForm.value[field.dependsOn])"
                                            scrollHeight="180px" [emptyMessage]="'general.noResultFound' | translate"
                                            placeholder="">

                                            <ng-template pTemplate="selectedItem">
                                                <div class="d-flex align-items-center justify-content-between w-100">
                                                    <div class="text-truncate">
                                                        {{ searchForm.value[field.name] ?
                                                        searchForm.value[field.name].name : (
                                                        field?.placeholder | translate) }}
                                                    </div>
                                                    <i *ngIf="searchForm.value[field?.name]" class="pi pi-times ml-2"
                                                        style="cursor: pointer;"
                                                        (click)="clearField(field?.name, $event);searchForm.get(field?.name)?.reset()"></i>
                                                </div>
                                            </ng-template>
                                        </p-dropdown>

                                        <ng-container *ngIf="field?.isLoading">
                                            <i class="pi pi-spin pi-spinner mx-2"></i>
                                        </ng-container>
                                    </span>

                                    <span *ngIf="field?.type === 'multiSelect'" class="p-input-icon-right d-block"
                                        [class.disabled]="field.dependsOn && !searchForm.value[field.dependsOn]">

                                        <p-multiSelect [options]="field?.listValues" [formControlName]="field?.name"
                                            optionLabel="name" [filter]="true" (onFocus)="focusedField = field?.name"
                                            (onHide)="focusedField = null"
                                            placeholder="{{ field?.placeholder | translate }}" styleClass="border-0"
                                            (onChange)="field.onChange ? this[field.onChange]($event) : onChangeControl(field.name)"
                                            filterBy="name" appendTo="body" [showClear]="false"
                                            [readonly]="field.isLoading || (field.dependsOn && !searchForm.value[field.dependsOn])"
                                            scrollHeight="180px" [emptyMessage]="'general.noResultFound' | translate"
                                            selectedItemsLabel="{0} selected"
                                            defaultLabel="{{ field?.placeholder | translate }}">

                                            <ng-template pTemplate="selectedItems">
                                                <div class="d-flex align-items-center justify-content-between w-100">
                                                    <!-- <div class="text-truncate">
                                                        {{ searchForm.value[field.name]?.length ?
                                                        searchForm.value[field.name] | json :
                                                        (field?.placeholder | translate) }}
                                                    </div> -->
                                                    <div class="text-truncate"
                                                        [class.form__quick-search__value--active]="searchForm.value[field?.name]?.length">
                                                        <span>
                                                            {{ getSelectedValues(field?.name) }}
                                                        </span>
                                                    </div>
                                                    <i *ngIf="searchForm.value[field?.name]?.length"
                                                        class="pi pi-times ml-2" style="cursor: pointer;"
                                                        (click)="clearField(field?.name, $event);searchForm.get(field?.name)?.reset()"></i>
                                                </div>
                                            </ng-template>
                                        </p-multiSelect>

                                        <ng-container *ngIf="field?.isLoading">
                                            <i class="pi pi-spin pi-spinner mx-2"></i>
                                        </ng-container>

                                    </span>


                                    <span *ngIf="field?.type === 'dateRange'" class="p-input-icon-right d-block">
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="w-100">
                                                <div class="d-flex align-items-center">
                                                    <div
                                                        class="filter-icon d-flex justify-content-center align-items-center">
                                                        <svg xmlns="http://www.w3.org/2000/svg"
                                                            class="icon icon-tabler icon-tabler-calendar-plus"
                                                            width="18" height="18" viewBox="0 0 24 24"
                                                            stroke-width="1.5" stroke="#ffffff" fill="none"
                                                            stroke-linecap="round" stroke-linejoin="round">
                                                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                                            <path
                                                                d="M12.5 21h-6.5a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v5" />
                                                            <path d="M16 3v4" />
                                                            <path d="M8 3v4" />
                                                            <path d="M4 11h16" />
                                                            <path d="M16 19h6" />
                                                            <path d="M19 16v6" />
                                                        </svg>
                                                    </div>
                                                    <p-calendar selectionMode="range" [showWeek]="true"
                                                        dateFormat="dd-mm-yy" [readonlyInput]="true"
                                                        formControlName="date"
                                                        placeholder="{{field?.placeholder|translate}}"
                                                        styleClass="event-calendar"
                                                        (clickOutside)="onChangeControl(field?.name)"
                                                        inputStyleClass="border-0" [showIcon]="true"></p-calendar>
                                                    <a *ngIf="searchForm.value[field?.name]"
                                                        (click)="clearField(field?.name, $event)"><i
                                                            class="pi pi-times"></i></a>
                                                </div>
                                            </div>
                                        </div>
                                    </span>

                                </div>
                            </div>
                        </div>

                        <button type="submit" (click)="search()"
                            class="w-100 border-0 d-flex align-items-center text-white justify-content-center py-3 gap-3 rounded mb-3"
                            style="background: var(--light-new-color);">
                            <span class="fw-bold fs-5-1 text-start">{{ 'general.searchNow' | translate }}</span>
                            <i class="pi pi-arrow-right scaleX-rtl text-white"></i>
                        </button>
                    </div>
                </form>

            </section>
        </div>
    </p-sidebar>
</div>
