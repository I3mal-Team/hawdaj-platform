<div id="popular-apps" class="py-7" [class.ar-apps]="currentLanguage=='ar'">
  <div class="align-items-center">

    <div id="gallary">
      <div
        class="gallery-container d-flex align-items-center justify-content-lg-end justify-content-center position-relative">
        <ng-container *ngFor="let item of items;let i=index; trackBy: trackByFn">
          <div class="gallery-img gallery-img-{{i}} position-relative overflow-hidden" *ngIf="i<5"
            [ngClass]="{'active': activeIndex === i}" (click)="setActive(i)">
            <!-- <img class="h-100 w-100" [defaultImage]="item?.image"
              [lazyLoad]="item?.image"
              [alt]="item?.title" onerror="src='assets/images/not-found/no-img.svg'"> -->
            <div class="image-content h-100">
              <img class="w-100 h-100" ngOptimizedImage [ngSrc]="item?.image"
                onerror="src='assets/images/not-found/no-img.svg'" width="350" height="250" [alt]="item?.title"
                onerror="src='assets/images/not-found/no-img.svg'">
            </div>
            <div class="position-absolute slider-info text-white w-100" *ngIf="activeIndex === i">
              <div class="p-2 d-flex flex-column justify-content-between h-100">
                <div>
                  <h5 [routerLink]="['/restaurants/'+item.slug]"
                    class="fs-5-1 text-capitalize fw-bold mb-2 text-truncate">
                    {{item?.title}}</h5>
                  <p [routerLink]="['/restaurants/'+item.slug]"
                    class="mb-1 text-white-color d-flex align-items-baseline gap-2 text-truncate fs-6-1">
                    <i class="fa fa-cutlery text-white-color"></i>
                    <span class="d-flex flex-wrap gap-1">
                      <ng-container *ngIf="item?.food_categories?.length>0; else noFoodCategory">
                        <ng-container *ngFor="let food of item?.food_categories;let i=index">
                          <span>{{food?.name}}</span><span *ngIf="i<item?.food_categories?.length-1">,</span>
                        </ng-container>
                      </ng-container>
                      <ng-template #noFoodCategory>
                        {{'general.noFoodCategory'|translate}}
                      </ng-template>
                    </span>
                  </p>
                  <a class="mb-1 text-white-color fs-6-1" [href]="item?.address" target="_blank">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="feather feather-map-pin text-white-color">
                      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                      <circle cx="12" cy="10" r="3"></circle>
                    </svg> {{item?.address_name||'titles.saudiArabia'| translate}}
                  </a>
                </div>
                <div [routerLink]="['/restaurants/'+item.slug]"
                  class="d-flex justify-content-between align-items-center gap-2 mt-2">
                  <span class="d-flex align-items-center gap-1 fs-6-1">
                    <div>
                      <img ngOptimizedImage [ngSrc]="'assets/images/icons/star.svg'"
                        onerror="src='assets/images/icons/star.svg'" width="17" height="17" alt="Star Image">
                    </div>
                    {{item?.rate}}
                  </span>
                  <p class="mb-0 d-flex gap-1 text-white-color fs-6-1">
                    <span class="">({{item?.review}})</span>
                    <span>{{'general.reviews'|translate}}</span>
                  </p>
                </div>
                <a class="details-icon d-flex justify-content-center d-none align-items-center gap-2 w-content mt-4 text-white-color text-nowrap"
                  [routerLink]="['/restaurants/'+item.slug]">
                  {{'general.moreDetails'|translate}}
                  <i class="pi pi-angle-right"></i>
                </a>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
      <nav class=" arrows-btns d-flex justify-content-center gap-3 mt-5">
        <button id="prev" class="d-flex justify-content-center align-items-center rounded-circle" (click)="prev()"
          [class.disabled]="activeIndex==0">
          <i class="fa fa-arrow-left scaleX-rtl"></i>
        </button>
        <button id="next" class="d-flex justify-content-center align-items-center rounded-circle" (click)="next()"
          [class.disabled]="activeIndex==items?.length-1">
          <i class="fa fa-arrow-right scaleX-rtl"></i>
        </button>
      </nav>
    </div>
  </div>
</div>
