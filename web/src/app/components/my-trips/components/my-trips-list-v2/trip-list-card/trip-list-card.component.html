<div class="list-card col-lg-2 col-md-3 col-6" (click)="closeDropdown()">
    <div class="overlay"></div>
    <div class="card-img-container">
        <img class="card-img" [appLazyLoadImage]="item?.image" [ngSrc]="item?.image" [alt]="item?.name"
            (error)="onImageError($event)" width="300" height="200" ngOptimizedImage>

        <div class="card-status d-flex align-items-center w-100 justify-content-end">
            <div class="open-menu d-flex align-items-center justify-content-end text-white gap-1" title="open-menu"
                (click)="collapse = !collapse;addClickOutsideListener();$event.stopPropagation()">
                <svg viewBox="0 0 24 24" width="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path
                            d="M12 12H12.01M12 6H12.01M12 18H12.01M13 12C13 12.5523 12.5523 13 12 13C11.4477 13 11 12.5523 11 12C11 11.4477 11.4477 11 12 11C12.5523 11 13 11.4477 13 12ZM13 18C13 18.5523 12.5523 19 12 19C11.4477 19 11 18.5523 11 18C11 17.4477 11.4477 17 12 17C12.5523 17 13 17.4477 13 18ZM13 6C13 6.55228 12.5523 7 12 7C11.4477 7 11 6.55228 11 6C11 5.44772 11.4477 5 12 5C12.5523 5 13 5.44772 13 6Z"
                            stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>
                </svg>
                <ul class="dropdown-menu border-0 shadow p-3 mt-3" [class.show]="collapse">
                    <li class="nav-item mb-2">
                        <a class="nav-link  w-100" (click)="collapse = !collapse" (click)="onDeleteClick()">
                            <span class="d-flex align-items-center w-100 gap-1 p-2">
                                <img src="assets/images-v2/pages/save-trip/icons/card/trash.svg" alt="trash"
                                    title="trash">
                                <span class="user text-danger">{{'general.delete'|translate}}</span>
                            </span>
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link  w-100" (click)="collapse = !collapse; onExploreClick()">
                            <span class="d-flex align-items-center w-100 gap-1 p-2">
                                <svg viewBox="0 0 24 24" width="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                                    <g id="SVGRepo_iconCarrier">
                                        <path fill-rule="evenodd" clip-rule="evenodd"
                                            d="M16.982 8.99791C17.5399 7.7427 16.2573 6.46011 15.0021 7.01799L10.0018 9.24033C9.66249 9.39115 9.39115 9.66249 9.24033 10.0018L7.01798 15.0021C6.46011 16.2573 7.74269 17.5399 8.99791 16.982L13.9982 14.7597C14.3375 14.6089 14.6089 14.3375 14.7597 13.9982L16.982 8.99791ZM10.9898 10.9898L14.6264 9.37359L13.0102 13.0102L9.37359 14.6264L10.9898 10.9898Z"
                                            fill="#0F0F0F"></path>
                                        <path fill-rule="evenodd" clip-rule="evenodd"
                                            d="M12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23ZM12 20.9869C7.03665 20.9869 3.01306 16.9633 3.01306 12C3.01306 7.03665 7.03665 3.01306 12 3.01306C16.9633 3.01306 20.9869 7.03665 20.9869 12C20.9869 16.9633 16.9633 20.9869 12 20.9869Z"
                                            fill="#0F0F0F"></path>
                                    </g>
                                </svg>
                                <span class="user">{{'general.discover'|translate}}</span>
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="card-content d-flex flex-column align-items-center">
            <h4>{{ item?.name }}</h4>

            <div class="d-flex gap-2 align-items-center justify-content-center">
                <p class="mt-1">
                    <svg fill="#ffffff" width="21" height="21" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                        <g id="SVGRepo_iconCarrier">
                            <path
                                d="M19,4H17V3a1,1,0,0,0-2,0V4H9V3A1,1,0,0,0,7,3V4H5A3,3,0,0,0,2,7V19a3,3,0,0,0,3,3H19a3,3,0,0,0,3-3V7A3,3,0,0,0,19,4Zm1,15a1,1,0,0,1-1,1H5a1,1,0,0,1-1-1V12H20Zm0-9H4V7A1,1,0,0,1,5,6H7V7A1,1,0,0,0,9,7V6h6V7a1,1,0,0,0,2,0V6h2a1,1,0,0,1,1,1Z">
                            </path>
                        </g>
                    </svg>
                    <span>
                        {{item?.start_date | date: 'd MMM y':'':currentLanguage}} - {{item?.end_date | date: 'd MMM
                        y':'':currentLanguage}} </span>
                </p>
            </div>
        </div>
    </div>
</div>
