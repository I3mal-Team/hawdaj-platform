<div class="add-contact-info-modal">
  <!-- Header -->
  <div class="add-contact-info-modal__header">
    <h2 class="add-contact-info-modal__title">{{ 'profile.addContactInfo' | translate }}</h2>
    <button type="button" class="add-contact-info-modal__close-btn" (click)="onCancel()"
      [attr.aria-label]="'general.close' | translate">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 8L16 16" stroke="#323232" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M16 8L8 16" stroke="#323232" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <!-- Form -->
  <form class="add-contact-info-modal__form" [formGroup]="addContactForm" (ngSubmit)="addLink()">
    <!-- Platform Dropdown -->
    <div class="add-contact-info-modal__group">
      <label class="add-contact-info-modal__label" for="name"
        [class.add-contact-info-modal__label--error]="shouldShowError('name')">
        {{ 'profile.selectSocialPlatform' | translate }}
      </label>
      <div class="add-contact-info-modal__control add-contact-info-modal__control--dropdown"
        [class.add-contact-info-modal__control--error]="shouldShowError('name')">
        <p-dropdown id="name" formControlName="name" [options]="socialOptions" optionLabel="title"
          class="add-contact-info-modal__dropdown" [filter]="true" filterBy="title" panelStyleClass="dropdown-new-panel"
          appendTo="body" scrollHeight="200px" dropdownIcon="fas fa-caret-down text-muted" [autofocusFilter]="false"
          [emptyMessage]="'general.noResultFound' | translate">
          <ng-template let-option pTemplate="item">
            <div class="add-contact-info-modal__dropdown-item">
              <span *ngIf="option?.id === 'linkedin'" class='rounded add-contact-info-modal__icon'>
                <img src="assets/images-v2/social/linkedin.svg" alt="LinkedIn" />
              </span>
              <span *ngIf="option?.id === 'twitter' || option?.id === 'X'"
                class='rounded bg-twitter add-contact-info-modal__icon'>
                <svg xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision"
                  text-rendering="geometricPrecision" image-rendering="optimizeQuality" fill-rule="evenodd"
                  clip-rule="evenodd" viewBox="0 0 512 509.64">
                  <rect width="512" height="509.64" rx="115.61" ry="115.61" />
                  <path fill="#fff" fill-rule="nonzero"
                    d="M323.74 148.35h36.12l-78.91 90.2 92.83 122.73h-72.69l-56.93-74.43-65.15 74.43h-36.14l84.4-96.47-89.05-116.46h74.53l51.46 68.04 59.53-68.04zm-12.68 191.31h20.02l-129.2-170.82H180.4l130.66 170.82z" />
                </svg> </span>
              <span *ngIf="option?.id === 'youtube'" class='rounded bg-youtube add-contact-info-modal__icon'>
                <img src="assets/images-v2/social/youtube.svg" alt="YouTube" />
              </span>
              <span *ngIf="option?.id === 'facebook'" class='rounded bg-color-face add-contact-info-modal__icon'>
                <img src="assets/images-v2/social/Facebook.svg" alt="Facebook" />
              </span>
              <span *ngIf="option?.id === 'instagram'" class='rounded bg-color-instagram add-contact-info-modal__icon'>
                <img src="assets/images-v2/social/Instagram.svg" alt="Instagram" />
              </span>
              <span *ngIf="option?.id === 'tiktok'" class='rounded bg-color-tiktok add-contact-info-modal__icon'>
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-brand-tiktok-filled"
                  width="17" height="17" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path
                    d="M16.083 2h-4.083a1 1 0 0 0 -1 1v11.5a1.5 1.5 0 1 1 -2.519 -1.1l.12 -.1a1 1 0 0 0 .399 -.8v-4.326a1 1 0 0 0 -1.23 -.974a7.5 7.5 0 0 0 1.73 14.8l.243 -.005a7.5 7.5 0 0 0 7.257 -7.495v-2.7l.311 .153c1.122 .53 2.333 .868 3.59 .993a1 1 0 0 0 1.099 -.996v-4.033a1 1 0 0 0 -.834 -.986a5.005 5.005 0 0 1 -4.097 -4.096a1 1 0 0 0 -.986 -.835z"
                    stroke-width="0" fill="currentColor" />
                </svg>
              </span>
              <span *ngIf="option?.id === 'whatsapp'" class='rounded bg-whatsapp add-contact-info-modal__icon'>
                <img src="assets/images-v2/social/whatsapp.svg" alt="WhatsApp" />
              </span>
              <i *ngIf="option?.id === 'personal_account'"
                class='pi pi-user rounded personal-website add-contact-info-modal__icon'></i>
              <span>{{ option?.title | translate }}</span>
            </div>
          </ng-template>
          <ng-template let-option pTemplate="selectedItem">
            <div class="add-contact-info-modal__selected" *ngIf="option; else noSelection">
              <div class="add-contact-info-modal__selected-content">
                <span *ngIf="option?.id === 'linkedin'" class='text-white rounded add-contact-info-modal__icon'>
                  <img src="assets/images-v2/social/linkedin.svg" alt="LinkedIn" />
                </span>
                <span *ngIf="option?.id === 'twitter' || option?.id === 'X'"
                  class='text-white rounded bg-twitter add-contact-info-modal__icon'>
                  <svg xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision"
                    text-rendering="geometricPrecision" image-rendering="optimizeQuality" fill-rule="evenodd"
                    clip-rule="evenodd" viewBox="0 0 512 509.64">
                    <rect width="512" height="509.64" rx="115.61" ry="115.61" />
                    <path fill="#fff" fill-rule="nonzero"
                      d="M323.74 148.35h36.12l-78.91 90.2 92.83 122.73h-72.69l-56.93-74.43-65.15 74.43h-36.14l84.4-96.47-89.05-116.46h74.53l51.46 68.04 59.53-68.04zm-12.68 191.31h20.02l-129.2-170.82H180.4l130.66 170.82z" />
                  </svg> </span>
                <span *ngIf="option?.id === 'youtube'"
                  class='text-white rounded bg-youtube add-contact-info-modal__icon'>
                  <img src="assets/images-v2/social/youtube.svg" alt="YouTube" />
                </span>
                <span *ngIf="option?.id === 'facebook'"
                  class='text-white rounded bg-color-face add-contact-info-modal__icon'>
                  <img src="assets/images-v2/social/Facebook.svg" alt="Facebook" />
                </span>
                <span *ngIf="option?.id === 'instagram'"
                  class='text-white rounded bg-color-instagram add-contact-info-modal__icon'>
                  <img src="assets/images-v2/social/Instagram.svg" alt="Instagram" />
                </span>
                <span *ngIf="option?.id === 'tiktok'"
                  class='text-white rounded bg-color-tiktok add-contact-info-modal__icon'>
                  <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-brand-tiktok-filled"
                    width="17" height="17" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                      d="M16.083 2h-4.083a1 1 0 0 0 -1 1v11.5a1.5 1.5 0 1 1 -2.519 -1.1l.12 -.1a1 1 0 0 0 .399 -.8v-4.326a1 1 0 0 0 -1.23 -.974a7.5 7.5 0 0 0 1.73 14.8l.243 -.005a7.5 7.5 0 0 0 7.257 -7.495v-2.7l.311 .153c1.122 .53 2.333 .868 3.59 .993a1 1 0 0 0 1.099 -.996v-4.033a1 1 0 0 0 -.834 -.986a5.005 5.005 0 0 1 -4.097 -4.096a1 1 0 0 0 -.986 -.835z"
                      stroke-width="0" fill="currentColor" />
                  </svg>
                </span>
                <span *ngIf="option?.id === 'whatsapp'"
                  class='text-white rounded bg-whatsapp add-contact-info-modal__icon'>
                  <img src="assets/images-v2/social/whatsapp.svg" alt="WhatsApp" />
                </span>
                <i *ngIf="option?.id === 'personal_account'"
                  class='pi pi-user text-white rounded personal-website add-contact-info-modal__icon'></i>
                <span>{{ option?.title | translate }}</span>
              </div>
              <button *ngIf="addContactFormControls.name.value" type="button" class="add-contact-info-modal__clear-btn"
                (click)="clearControl('name', $event)" [attr.aria-label]="'general.clearSearch' | translate">
                <i class="pi pi-times"></i>
              </button>
            </div>
            <ng-template #noSelection>
              <span class="add-contact-info-modal__placeholder">{{ 'profile.selectSocialPlatform' | translate }}</span>
            </ng-template>
          </ng-template>
        </p-dropdown>
      </div>
      <p class="add-contact-info-modal__error" *ngIf="shouldShowError('name')">
        {{ getErrorMessage('name') | translate }}
      </p>
    </div>

    <!-- Link Input -->
    <div class="add-contact-info-modal__group">
      <label class="add-contact-info-modal__label" for="link"
        [class.add-contact-info-modal__label--error]="shouldShowError('link')">
        {{ 'profile.socialPlatformLink' | translate }}
      </label>
      <div class="add-contact-info-modal__control"
        [class.add-contact-info-modal__control--error]="shouldShowError('link')">
        <input id="link" type="text" class="add-contact-info-modal__input"
          [placeholder]="isWhatsApp() ? ('profile.enterWhatsAppLinkOrNumber' | translate) : ('profile.enterSocialLink' | translate)"
          formControlName="link" />
      </div>
      <p class="add-contact-info-modal__error" *ngIf="shouldShowError('link')">
        {{ getErrorMessage('link') | translate }}
      </p>
    </div>

    <!-- Actions -->
    <div class="add-contact-info-modal__actions">
      <button type="button" class="add-contact-info-modal__cancel-btn" (click)="onCancel()">
        {{ 'general.cancel' | translate }}
      </button>
      <button type="submit" class="add-contact-info-modal__submit-btn">
        {{ 'general.add' | translate }}
      </button>
    </div>
  </form>
</div>
