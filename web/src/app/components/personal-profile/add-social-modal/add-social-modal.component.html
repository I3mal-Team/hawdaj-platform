<div class="add-social">
  <form [formGroup]="addSocialForm">
    <div class="row">
      <div class="col-12">
        <div class="mb-4">
          <ng-container *ngIf="isEdit; else elseSelect">
            <input type="text" class="form-control" disabled [value]="this.item?.name.title">
          </ng-container>
          <ng-template #elseSelect>
            <div class="mb-3 d-flex flex-column">
              <label for="name" class="custom-label mb-2 required">
                {{'labels.select'|translate}}
              </label>
              <span class="p-input-icon-right d-block bg-transparent">
                <p-dropdown [options]="socialOptions" formControlName="name" optionLabel="title" [filter]="true"
                  [virtualScroll]="true" filterPlaceholder="{{'placeholder.search'|translate}}"
                  [virtualScrollItemSize]="40" filterBy="title" appendTo="body" scrollHeight="200px"
                  [emptyMessage]="'No results found'" [showClear]="false" placeholder="{{'placeholder.select'|translate}}">
                  
                  <!-- Custom Selected Item Template with pi-times -->
                  <ng-template pTemplate="selectedItem">
                    <div class="d-flex align-items-center justify-content-between mt-1">
                      <!-- Existing Social Cases (add icons for selected value) -->
                       <div class="d-flex align-items-center gap-2">
                      <i *ngIf="addSocialForm.value.name?.id === 'linkedin'"
                        class='pi pi-linkedin text-white rounded bg-linkedin fs-12 icon-social-settings'></i>
                      <span *ngIf="addSocialForm.value.name?.id === 'twitter'"
                        class='text-white rounded bg-twitter fs-12 icon-social-settings'>
                        <svg [classList]="'hover-icon'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                          fill="currentColor" class="bi bi-twitter-x" viewBox="0 0 16 16">
                          <path
                            d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865l8.875 11.633Z" />
                        </svg>
                      </span>
                      <i *ngIf="addSocialForm.value.name?.id === 'youtube'"
                        class='pi pi-youtube text-white rounded bg-youtube fs-12 icon-social-settings'></i>
                      <i *ngIf="addSocialForm.value.name?.id === 'facebook'"
                        class='pi pi-facebook text-white rounded bg-color-face fs-12 icon-social-settings'></i>
                      <i *ngIf="addSocialForm.value.name?.id === 'instagram'"
                        class='pi pi-instagram text-white rounded bg-color-instagram fs-12 icon-social-settings'></i>
                      <span *ngIf="addSocialForm.value.name?.id === 'tiktok'"
                        class='text-white rounded bg-color-tiktok fs-12 icon-social-settings'>
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-brand-tiktok-filled"
                          width="17" height="17" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
                          stroke-linecap="round" stroke-linejoin="round">
                          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                          <path
                            d="M16.083 2h-4.083a1 1 0 0 0 -1 1v11.5a1.5 1.5 0 1 1 -2.519 -1.1l.12 -.1a1 1 0 0 0 .399 -.8v-4.326a1 1 0 0 0 -1.23 -.974a7.5 7.5 0 0 0 1.73 14.8l.243 -.005a7.5 7.5 0 0 0 7.257 -7.495v-2.7l.311 .153c1.122 .53 2.333 .868 3.59 .993a1 1 0 0 0 1.099 -.996v-4.033a1 1 0 0 0 -.834 -.986a5.005 5.005 0 0 1 -4.097 -4.096a1 1 0 0 0 -.986 -.835z"
                            stroke-width="0" fill="currentColor" />
                        </svg>
                      </span>
                      <!-- New Case for Website -->
                      <i *ngIf="addSocialForm.value.name?.id === 'personal_account'"
                        class='pi pi-user text-white rounded personal-website fs-12 icon-social-settings'></i>
              
                      <span class="text-capitalize text-dark">{{addSocialForm.value.name?.title}}</span>
                    </div>
                      <!-- Clear Icon -->
                      <i *ngIf="addSocialForm?.value?.name"
                        class="pi pi-times cursor-pointer" (click)="clearSelection()"></i>
                    </div>
                  </ng-template>
              
                  <!-- Custom Item Template -->
                  <ng-template let-item pTemplate="item">
                    <div class="d-flex align-items-center gap-2">
                      <i *ngIf="item?.id === 'linkedin'"
                        class='pi pi-linkedin text-white rounded bg-linkedin fs-12 icon-social-settings'></i>
                      <span *ngIf="item?.id === 'twitter'"
                        class='text-white rounded bg-twitter fs-12 icon-social-settings'>
                        <svg [classList]="'hover-icon'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                          fill="currentColor" class="bi bi-twitter-x" viewBox="0 0 16 16">
                          <path
                            d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865l8.875 11.633Z" />
                        </svg>
                      </span>
                      <i *ngIf="item?.id === 'youtube'"
                        class='pi pi-youtube text-white rounded bg-youtube fs-12 icon-social-settings'></i>
                      <i *ngIf="item?.id === 'facebook'"
                        class='pi pi-facebook text-white rounded bg-color-face fs-12 icon-social-settings'></i>
                      <i *ngIf="item?.id === 'instagram'"
                        class='pi pi-instagram text-white rounded bg-color-instagram fs-12 icon-social-settings'></i>
                      <span *ngIf="item?.id === 'tiktok'"
                        class='text-white rounded bg-color-tiktok fs-12 icon-social-settings'>
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-brand-tiktok-filled"
                          width="17" height="17" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
                          stroke-linecap="round" stroke-linejoin="round">
                          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                          <path
                            d="M16.083 2h-4.083a1 1 0 0 0 -1 1v11.5a1.5 1.5 0 1 1 -2.519 -1.1l.12 -.1a1 1 0 0 0 .399 -.8v-4.326a1 1 0 0 0 -1.23 -.974a7.5 7.5 0 0 0 1.73 14.8l.243 -.005a7.5 7.5 0 0 0 7.257 -7.495v-2.7l.311 .153c1.122 .53 2.333 .868 3.59 .993a1 1 0 0 0 1.099 -.996v-4.033a1 1 0 0 0 -.834 -.986a5.005 5.005 0 0 1 -4.097 -4.096a1 1 0 0 0 -.986 -.835z"
                            stroke-width="0" fill="currentColor" />
                        </svg>
                      </span>
                      <!-- New Case for Website -->
                      <i *ngIf="item?.id === 'personal_account'"
                        class='pi pi-user text-white rounded personal-website fs-12 icon-social-settings'></i>
              
                      <span class="text-capitalize text-dark">{{item?.title}}</span>
                    </div>
                  </ng-template>
                </p-dropdown>
              </span>
              
              <div class="mt-2">
                <ng-container
                  *ngIf="addSocialFormControls?.name?.invalid && (addSocialFormControls?.name?.dirty || addSocialFormControls?.name?.touched)">
                  <ng-container *ngIf="addSocialFormControls?.name?.errors?.['required']">
                    <span class="text-danger fs-8">
                      {{'validations.required_field'|translate}}
                    </span>
                  </ng-container>
                </ng-container>
              </div>
            </div>
          </ng-template>
        </div>
      </div>

      <!-- Social Link Input -->
      <div class="mb-3">
        <label for="link" class="custom-label mb-2 required">
          {{'labels.link'|translate}}
        </label>
        <input id="link" type="text" class="form-control" formControlName="link"
          (input)="publicService.clearValidationErrors(addSocialFormControls?.link)" placeholder="https://"
          autocomplete="cc-name">
        <div class="my-2">
          <ng-container
            *ngIf="addSocialFormControls?.link?.invalid && (addSocialFormControls?.link?.dirty || addSocialFormControls?.link?.touched)">
            <ng-container *ngIf="addSocialFormControls?.link?.errors?.['required']">
              <span class="text-danger fs-8">
                {{'validations.required_field' | translate}}
              </span>
            </ng-container>
            <ng-container *ngIf="addSocialFormControls?.link?.errors?.pattern">
              <span class="text-danger fs-8 d-block">
                {{'validations.valueNotValid'| translate}}
              </span>
            </ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  </form>

  <!-- Submit Button -->
  <div class="d-flex align-items-center justify-content-center mt-3">
    <button type="button" class="btn btn-solid-main w-100" (click)="addLink()">
      <ng-container *ngIf="isEdit; else elseAdd">
        <span class="mx-1 px-3">
          {{'general.update' | translate}}
        </span>
      </ng-container>
      <ng-template #elseAdd>
        <span class="mx-1 px-3">
          {{'general.add' | translate}}
        </span>
      </ng-template>
    </button>
  </div>
</div>
