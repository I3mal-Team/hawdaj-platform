name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Using secrets names for the new server
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e # Stop script on any error

            # 1. Navigate to the new project directory
            PROJECT_PATH="/var/www/hawdaj_project/hawdaj-frontend-production"

            echo "🚀 Starting deployment to: $PROJECT_PATH"

            # Ensure the directory exists
            if [ ! -d "$PROJECT_PATH" ]; then
              echo "❌ Directory not found! Please check if rsync finished correctly."
              exit 1
            fi

            cd "$PROJECT_PATH"

            # Setup Node.js environment (Ensure NVM is installed on the server)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin

            # 2. Fix Git permissions to avoid "dubious ownership" errors
            git config --global --add safe.directory "$PROJECT_PATH"

            # 3. Pull latest code
            echo "📥 Pulling latest code..."
            git stash
            git pull origin main
            git stash pop || echo "⚠️ No stash to pop"

            # 4. Install dependencies
            echo "📦 Installing dependencies..."
            npm install

            # 5. Safe Build Strategy (Zero Downtime Protection)
            echo "🏗️ Starting Safe Build Process..."

            # A) Create backup of the current build
            if [ -d "dist" ]; then
                echo "Backing up current dist folder..."
                rm -rf dist_backup
                mv dist dist_backup
            fi

            # B) Attempt to Build
            echo "Building production version..."
            if npm run build:ssr-prod; then
                echo "✅ Build Successful."
                # Remove backup as it is no longer needed
                rm -rf dist_backup
            else
                echo "❌ BUILD FAILED. Restoring previous version..."
                # Remove the partial/failed build
                rm -rf dist
                # Restore the backup
                if [ -d "dist_backup" ]; then
                    mv dist_backup dist
                fi
                echo "Site restored to previous state."
                exit 1
            fi

            # 6. Manage PM2 Process
            echo "🔄 Managing PM2 Process..."

            # Start process if it doesn't exist, otherwise reload it for zero downtime
            if pm2 list | grep -q "hawdaj-production"; then
                pm2 reload hawdaj-production
            else
                PORT=4001 pm2 start dist/hawdaj/server/main.js --name "hawdaj-production"
            fi

            pm2 save

            # 7. Reload Nginx (Optional, ensures config updates apply)
            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "🎉 Production Deployment completed successfully!"