<div class="reviews row gap-3 mx-0">
    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="17" viewBox="0 0 25 17" fill="none"

            fill="#371A4C" fill-opacity="0.8" />
    </svg>
    <div class="d-flex p-0 col-md-3 align-items-center flex-column gap-1">
        <div class="img-container">
            <img [src]="(currentLoginInformation?.PersonalData?.id == review?.user_id)? currentLoginInformation?.PersonalData?.photo : review?.image"
                alt="{{review?.name}}" onerror="this.src='assets/images-v2/pages/place-details/arab-man.jpg'">
        </div>
        <p class="title m-0 text-center">
            {{review?.name}}</p>
        <div class="stars">
            <ng-container *ngFor="let star of [].constructor(review?.rate - 0)">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="16" viewBox="0 0 17 16" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M5.20486 13.8884C4.86681 14.0649 4.45785 14.0338 4.15034 13.8083C3.84282 13.5828 3.69025 13.2021 3.75692 12.8267L4.29648 9.73404L2.02487 7.55714C1.7472 7.29234 1.64544 6.89207 1.76293 6.52681C1.88042 6.16156 2.19646 5.89568 2.57643 5.84242L5.73041 5.39157L7.15434 2.55105C7.32317 2.21039 7.67051 1.99487 8.05071 1.99487C8.43091 1.99487 8.77825 2.21039 8.94708 2.55105L10.371 5.39157L13.525 5.84242C13.905 5.89568 14.221 6.16156 14.3385 6.52681C14.456 6.89207 14.3542 7.29234 14.0766 7.55714L11.8049 9.73404L12.3445 12.8273C12.4112 13.2028 12.2586 13.5835 11.9511 13.809C11.6436 14.0345 11.2346 14.0656 10.8966 13.8891L8.05071 12.4185L5.20486 13.8884Z"
                        fill="#FFD04F" stroke="#FFD04F" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </ng-container>
            <ng-container *ngFor="let star of [].constructor(5 - review?.rate)">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="16" viewBox="0 0 17 16" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M5.20486 13.8884C4.86681 14.0649 4.45785 14.0338 4.15034 13.8083C3.84282 13.5828 3.69025 13.2021 3.75692 12.8267L4.29648 9.73404L2.02487 7.55714C1.7472 7.29234 1.64544 6.89207 1.76293 6.52681C1.88042 6.16156 2.19646 5.89568 2.57643 5.84242L5.73041 5.39157L7.15434 2.55105C7.32317 2.21039 7.67051 1.99487 8.05071 1.99487C8.43091 1.99487 8.77825 2.21039 8.94708 2.55105L10.371 5.39157L13.525 5.84242C13.905 5.89568 14.221 6.16156 14.3385 6.52681C14.456 6.89207 14.3542 7.29234 14.0766 7.55714L11.8049 9.73404L12.3445 12.8273C12.4112 13.2028 12.2586 13.5835 11.9511 13.809C11.6436 14.0345 11.2346 14.0656 10.8966 13.8891L8.05071 12.4185L5.20486 13.8884Z"
                        stroke="#AEAEAE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </ng-container>
        </div>

    </div>
    <p class="description text-center text-md-start col-md-8 p-0 p-md-1">
        {{review?.rateText}}
    </p>
</div>
