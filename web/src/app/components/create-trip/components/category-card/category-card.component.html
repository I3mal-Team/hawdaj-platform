<div class="p-3 category-card h-100 d-flex justify-content-between align-items-center" (click)="selectCategory()">
  <div class="d-flex flex-column gap-2 mb-2">
    <h5 class="fs-4-1 fw-bold mb-0 text-white-color text-capitalize" for="item">
      {{item?.name}}
    </h5>
  </div>
  <input class="form-check-input mt-0" type="checkbox" (click)="selectCategory()" id="{{item?.id}}" value="{{item?.id}}"
    (click)="$event.stopPropagation()" [checked]="item?.isChecked">
</div>
